<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Indigo-Blue to Bright Lime/Emerald Green -->
    <linearGradient id="appBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14346B" />
      <stop offset="35%" stop-color="#1B4D7E" />
      <stop offset="65%" stop-color="#2D7B48" />
      <stop offset="100%" stop-color="#6BB823" />
    </linearGradient>

    <!-- Top Gloss Highlight Gradient -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Silver Chrome 'L' Gradients -->
    <linearGradient id="silverBase" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#D9DFE8" />
      <stop offset="50%" stop-color="#8E9AA8" />
      <stop offset="75%" stop-color="#E2E7ED" />
      <stop offset="100%" stop-color="#627081" />
    </linearGradient>

    <linearGradient id="silverHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#C2CCD8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9" />
    </linearGradient>

    <!-- Vibrant Lime Green 'N' Gradients -->
    <linearGradient id="greenBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A6F02E" />
      <stop offset="30%" stop-color="#7CD61A" />
      <stop offset="70%" stop-color="#55A810" />
      <stop offset="100%" stop-color="#347506" />
    </linearGradient>

    <linearGradient id="greenHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E4FFA3" />
      <stop offset="40%" stop-color="#99EB22" />
      <stop offset="100%" stop-color="#468F0A" />
    </linearGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#07172B" flood-opacity="0.65" />
    </filter>

    <filter id="emblemShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#05121F" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle Base with Shadow -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#appBgGrad)" filter="url(#dropShadow)" />

  <!-- Outer Glass Border Ring -->
  <rect x="25" y="25" width="462" height="462" rx="103" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="3" />
  <rect x="28" y="28" width="456" height="456" rx="100" fill="none" stroke="rgba(0,0,0,0.2)" stroke-width="2" />

  <!-- Upper Glassy Dome Sheen -->
  <path d="M 28 128 C 28 72 72 28 128 28 L 384 28 C 440 28 484 72 484 128 C 484 220 380 240 256 240 C 132 240 28 220 28 128 Z" fill="url(#glossGrad)" />

  <!-- ── 3D Intertwined 'LN' Monogram Emblem ── -->
  <g filter="url(#emblemShadow)" transform="translate(256, 256)">

    <!-- 1. Silver Metallic 'L' Main Body -->
    <!-- Upright stem and lower swash curve of 'L' -->
    <path d="M -10 -115 
             C 5 -115 25 -95 15 -55 
             C 8 -25 -25 15 -65 55 
             C -95 85 -125 105 -135 110 
             C -130 95 -105 50 -75 10 
             C -45 -30 -15 -85 -15 -105 
             C -15 -112 -12 -115 -10 -115 Z" 
          fill="url(#silverBase)" />

    <!-- Silver 'L' Bottom Flourish / Base Foot -->
    <path d="M -135 110 
             C -90 90 -20 85 45 95 
             C 75 100 95 108 105 118 
             C 75 114 20 112 -35 108 
             C -85 105 -120 106 -135 110 Z" 
          fill="url(#silverBase)" />

    <!-- Silver 'L' Inner 3D Chrome Bevels & Reflections -->
    <path d="M -8 -110 
             C 12 -90 8 -50 -5 -15 
             C -25 25 -70 65 -110 95 
             C -80 65 -45 25 -25 -10 
             C -5 -45 5 -85 -8 -110 Z" 
          fill="url(#silverHighlight)" opacity="0.8" />

    <!-- Silver 'L' Sharp 3D Bevel Core -->
    <path d="M -12 -112 
             C -2 -80 -35 -20 -60 15 
             C -85 50 -120 85 -128 100 
             C -115 75 -85 40 -60 5 
             C -35 -30 -5 -75 -12 -112 Z" 
          fill="#FFFFFF" opacity="0.75" />

    <!-- 2. Vibrant Glossy Green 'N' Intertwining Loop & Arms -->
    <!-- Left Arched Swash overlapping 'L' -->
    <path d="M -85 -35 
             C -50 -75 5 -45 35 -10 
             C 55 15 75 55 90 95 
             C 75 60 50 15 25 -15 
             C 0 -45 -50 -60 -85 -35 Z" 
          fill="url(#greenBase)" />

    <!-- Right Vertical Arm of 'N' with Crown Serif -->
    <path d="M 85 -85 
             C 105 -95 125 -65 115 -25 
             L 100 75 
             C 95 105 80 115 65 115 
             C 70 95 85 65 90 20 
             L 100 -45 
             C 105 -70 95 -80 85 -85 Z" 
          fill="url(#greenBase)" />

    <!-- Diagonal Bridge of 'N' seamlessly connecting swooshes -->
    <path d="M -85 -35 
             C -35 -40 10 10 55 65 
             C 80 95 95 110 100 115 
             C 85 110 65 80 35 35 
             C 5 -5 -40 -35 -85 -35 Z" 
          fill="url(#greenHighlight)" />

    <!-- Green 'N' Top Gloss Highlight Ridge -->
    <path d="M -75 -40 
             C -35 -65 10 -35 35 0 
             C 55 30 75 70 85 95 
             C 75 70 55 35 30 5 
             C 10 -25 -35 -50 -75 -40 Z" 
          fill="#FFFFFF" opacity="0.6" />

    <path d="M 90 -80 
             C 102 -86 112 -65 108 -35 
             L 95 50 
             C 90 25 98 -45 90 -80 Z" 
          fill="#FFFFFF" opacity="0.7" />

    <!-- Chrome Edge Shimmer Dot -->
    <circle cx="102" cy="-70" r="4" fill="#FFFFFF" opacity="0.9" />
    <circle cx="-10" cy="-110" r="4" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>
